<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>=== | (-(-_(-_-)_-)-) TMask.pl (-(-_(-_-)_-)-) | ===</title>
  <style>
    :root {
      --green: #00ff41;
      --green-dim: #00cc33;
      --green-dark: #003310;
      --yellow: #ffd700;
      --cyan: #00e5ff;
      --red: #ff4444;
      --bg: #0a0a0a;
      --bg2: #111;
      --text: #c8ffc8;
      --prompt-color: #00ff41;
      --glow: 0 0 8px #00ff41, 0 0 16px #00ff4155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* CRT scanline overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* subtle vignette */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
      z-index: 9998;
    }

    .window {
      width: 100%;
      max-width: 860px;
      background: var(--bg2);
      border-radius: 10px;
      box-shadow: 0 0 0 1px #222, 0 0 40px rgba(0,255,65,0.15), 0 20px 60px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Title bar */
    .title-bar {
      background: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .dot {
      width: 13px; height: 13px;
      border-radius: 50%;
      cursor: default;
    }
    .dot.close   { background: #ff5f57; }
    .dot.min     { background: #febc2e; }
    .dot.max     { background: #28c840; }
    .bar-title {
      flex: 1;
      text-align: center;
      color: #666;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .bar-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      opacity: 0.85;
    }

    /* Terminal body */
    .terminal {
      padding: 20px;
      min-height: 520px;
      max-height: 70vh;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      scroll-behavior: smooth;
    }

    .terminal::-webkit-scrollbar { width: 4px; }
    .terminal::-webkit-scrollbar-track { background: transparent; }
    .terminal::-webkit-scrollbar-thumb { background: #00ff4133; border-radius: 2px; }

    /* Output lines */
    .line { margin: 1px 0; white-space: pre-wrap; word-break: break-word; }
    .line.green  { color: var(--green); text-shadow: var(--glow); }
    .line.yellow { color: var(--yellow); }
    .line.cyan   { color: var(--cyan); }
    .line.red    { color: var(--red); }
    .line.dim    { color: #556655; }
    .line.white  { color: #e0e0e0; }
    .line.blank  { height: 8px; }

    .cmd-echo {
      color: var(--green-dim);
      margin-top: 10px;
    }

    /* Input row */
    .input-row {
      display: flex;
      align-items: center;
      padding: 4px 0 2px;
      margin-top: 6px;
    }
    .prompt {
      color: var(--green);
      text-shadow: var(--glow);
      white-space: nowrap;
      flex-shrink: 0;
      font-size: 14px;
    }
    #cmd-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--green);
      font-family: inherit;
      font-size: 14px;
      flex: 1;
      caret-color: var(--green);
      margin-left: 2px;
    }

    /* Quick command pills */
    .pills {
      padding: 14px 20px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid #1a1a1a;
    }
    .pill {
      background: transparent;
      border: 1px solid #00ff4133;
      color: var(--green-dim);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill:hover {
      background: #00ff4111;
      border-color: var(--green);
      color: var(--green);
      text-shadow: var(--glow);
    }
    .pill-label {
      color: #444;
      font-size: 12px;
      padding: 4px 4px;
      align-self: center;
    }

    /* Animations */
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .cursor { display: inline-block; width: 8px; height: 14px; background: var(--green); vertical-align: text-bottom; animation: blink 1s step-end infinite; }

    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    .line { animation: fadeIn 0.12s ease-out; }

    /* Link */
    .tlink {
      color: var(--cyan);
      text-decoration: none;
    }
    .tlink:hover { text-decoration: underline; }

    /* Mobile */
    @media (max-width: 600px) {
      body { padding: 8px; }
      .terminal { font-size: 12px; max-height: 60vh; padding: 12px; }
      .prompt, #cmd-input { font-size: 12px; }
      .bar-title { font-size: 11px; }
    }
  </style>
</head>
<body>

<div class="window">
  <div class="title-bar">
    <span class="dot close"></span>
    <span class="dot min"></span>
    <span class="dot max"></span>
    <span class="bar-title">
      <img src="logo.png" class="bar-logo" alt="" onerror="this.style.display='none'">
      biuro@tmask.pl: ~
    </span>
  </div>

  <div class="terminal" id="terminal">
    <!-- output injected by JS -->
    <div class="input-row" id="input-row">
      <span class="prompt">daniel@tmask:~$&nbsp;</span>
      <input type="text" id="cmd-input" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="">
    </div>
  </div>

  <div class="pills">
    <span class="pill-label">szybkie komendy →</span>
    <button class="pill" onclick="run('whoami')">whoami</button>
    <button class="pill" onclick="run('skills')">skills</button>
    <button class="pill" onclick="run('projects')">projects</button>
    <button class="pill" onclick="run('contact')">contact</button>
    <button class="pill" onclick="run('social')">social</button>
    <button class="pill" onclick="run('help')">help</button>
    <button class="pill" onclick="run('clear')">clear</button>
  </div>
</div>

<script>
const term = document.getElementById('terminal');
const inputRow = document.getElementById('input-row');
const input = document.getElementById('cmd-input');
let history = [];
let histIdx = -1;
let booting = false;

// ── Output helpers ────────────────────────────────────────────────────
function addLine(text = '', cls = '', delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'line ' + cls;
      if (text === '') { el.classList.add('blank'); el.innerHTML = '&nbsp;'; }
      else el.innerHTML = text;
      term.insertBefore(el, inputRow);
      term.scrollTop = term.scrollHeight;
      resolve();
    }, delay);
  });
}

async function addLines(lines, baseDelay = 0, step = 40) {
  for (let i = 0; i < lines.length; i++) {
    await addLine(lines[i][0], lines[i][1] || '', baseDelay + i * step);
  }
  return new Promise(r => setTimeout(r, baseDelay + lines.length * step));
}

function prompt_echo(cmd) {
  const el = document.createElement('div');
  el.className = 'line cmd-echo';
  el.textContent = 'daniel@tmask:~$ ' + cmd;
  term.insertBefore(el, inputRow);
}

// ── ASCII art header ──────────────────────────────────────────────────
const ASCII = [
  ' ████████╗███╗   ███╗ █████╗ ███████╗██╗  ██╗',
  ' ╚══██╔══╝████╗ ████║██╔══██╗██╔════╝██║ ██╔╝',
  '    ██║   ██╔████╔██║███████║███████╗█████╔╝ ',
  '    ██║   ██║╚██╔╝██║██╔══██║╚════██║██╔═██╗ ',
  '    ██║   ██║ ╚═╝ ██║██║  ██║███████║██║  ██╗',
  '    ╚═╝   ╚═╝     ╚═╝╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝',
];

// ── Boot sequence ─────────────────────────────────────────────────────
async function boot() {
  booting = true;
  input.disabled = true;

  const bootLines = [
    ['TMask OS v2.0.26 — initializing...', 'dim'],
    ['[  OK  ] Loading kernel modules', 'dim'],
    ['[  OK  ] Mounting filesystems', 'dim'],
    ['[  OK  ] Starting network services', 'dim'],
    ['[  OK  ] Connecting to tmask.pl', 'dim'],
    ['', ''],
  ];

  for (let i = 0; i < bootLines.length; i++) {
    await addLine(bootLines[i][0], bootLines[i][1], i * 90);
  }

  await new Promise(r => setTimeout(r, bootLines.length * 90 + 100));

  for (let i = 0; i < ASCII.length; i++) {
    await addLine(ASCII[i], 'green', i * 60);
  }

  await new Promise(r => setTimeout(r, ASCII.length * 60 + 80));

  const welcome = [
    ['', ''],
    ['  <span style="color:#00e5ff;font-weight:bold">Daniel Niemczok</span> <span class="dim">—</span> DevOps &amp; Automation Engineer', 'white'],
    ['  Infrastructure · CI/CD · AI/LLM · Python · Ansible · Kubernetes', 'dim'],
    ['', ''],
    ['  Wpisz <span style="color:#ffd700">help</span> aby zobaczyć dostępne komendy.', ''],
    ['  Możesz też kliknąć szybkie komendy poniżej.', 'dim'],
    ['', ''],
  ];

  for (let i = 0; i < welcome.length; i++) {
    await addLine(welcome[i][0], welcome[i][1], i * 50);
  }

  await new Promise(r => setTimeout(r, welcome.length * 50 + 100));
  booting = false;
  input.disabled = false;
  input.focus();
}

// ── Commands ──────────────────────────────────────────────────────────
const COMMANDS = {

    ];
  },

      ['  Inżynier z wieloletnim doświadczeniem w budowaniu', 'white'],

      ['', ''],
      ['  Pomagam firmom wdrażać nowoczesne rozwiązania DevOps,', 'white'],
      ['  automatyzować powtarzalne zadania i integrować AI', 'white'],
      ['  w codziennych procesach biznesowych.', 'white'],
      ['', ''],
      ['  Lokalizacja : Polska', 'dim'],
      ['  Dostępność  : <span style="color:#00ff41">● Dostępny do współpracy</span>', ''],
      ['  Email       : <a class="tlink" href="mailto:biuro@tmask.pl">biuro@tmask.pl</a>', ''],
      ['', ''],
    ];
  },

  skills() {
    return [
      ['', ''],
      ['  ── INFRASTRUKTURA ──────────────────────────────', 'yellow'],
      ['  Docker       ████████████████████  expert', ''],
      ['  Kubernetes   ████████████████░░░░  advanced', ''],
      ['  Linux/Bash   ████████████████████  expert', ''],
      ['  Proxmox      ████████████████░░░░  advanced', ''],
      ['  Nginx/Apache ███████████████░░░░░  advanced', ''],
      ['  Mikrotik     ████████████████████  expert', ''],
      ['', ''],
      ['  ── AUTOMATYZACJA ──────────────────────────────', 'yellow'],
      ['  Ansible      ████████████████████  expert', ''],
      ['  n8n          ████████████████░░░░  advanced', ''],
      ['  Terraform    ████████████░░░░░░░░  intermediate', ''],
      ['  Jenkins/CI   ████████████████░░░░  advanced', ''],
      ['', ''],
      ['  ── PROGRAMOWANIE ──────────────────────────────', 'yellow'],
      ['  Python       ████████████████████  expert', ''],
      ['  PowerShell   ████████████████░░░░  advanced', ''],
      ['  Bash         ████████████████████  expert', ''],
      ['', ''],
      ['  ── AI &amp; LLM ──────────────────────────────────', 'yellow'],
      ['  Claude API   ████████████████░░░░  advanced', ''],
      ['  LLM Deploy   ████████████░░░░░░░░  intermediate', ''],
      ['  RAG / Agents ████████████░░░░░░░░  intermediate', ''],
      ['', ''],
      ['  ── MONITORING ─────────────────────────────────', 'yellow'],
      ['  Prometheus   ███████████████░░░░░  advanced', ''],
      ['  Grafana      ████████████████░░░░  advanced', ''],
      ['  ELK Stack    ████████████░░░░░░░░  intermediate', ''],
      ['', ''],
    ];
  },

  projects() {
    return [

      ['  [01] Infrastructure Automation Platform', 'cyan'],

      ['', ''],

      ['', ''],

      ['       Apache NiFi + Elasticsearch — przetwarzanie', ''],

      ['', ''],

      ['', ''],

    ];
  },

  contact() {
    return [
      ['', ''],

      ['', ''],

    ];

  social() {

  'cat cv.txt'() {

  clear() { return null; },

  default(cmd) {
    return [
      ['', ''],
      ['  bash: ' + cmd + ': command not found', 'red'],

};

// ── Run command ───────────────────────────────────────────────────────
function run(cmd) {
  cmd = cmd.trim().toLowerCase();
  if (!cmd) return;

  if (history[0] !== cmd) history.unshift(cmd);
  if (history.length > 50) history.pop();
  histIdx = -1;

  prompt_echo(cmd);

  if (cmd === 'clear') {
    const lines = term.querySelectorAll('.line:not(#input-row .line)');
    lines.forEach(l => l.remove());
    // remove all children except inputRow
    Array.from(term.children).forEach(c => { if (c !== inputRow) c.remove(); });
    return;
  }

  const fn = COMMANDS[cmd] || COMMANDS.default;
  const output = fn ? fn(cmd) : COMMANDS.default(cmd);

  if (output) {
    output.forEach((l, i) => {
      addLine(l[0], l[1] || '', i * 18);
    });
  }
}

// ── Input handling ────────────────────────────────────────────────────
input.addEventListener('keydown', e => {
  if (booting) return;

  if (e.key === 'Enter') {
    const cmd = input.value;
    input.value = '';
    run(cmd);
  }

  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) histIdx++;
    input.value = history[histIdx] || '';
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) histIdx--;
    else { histIdx = -1; input.value = ''; return; }
    input.value = history[histIdx] || '';
  }

  // Tab completion
  if (e.key === 'Tab') {
    e.preventDefault();
    const val = input.value.toLowerCase();
    const match = Object.keys(COMMANDS).find(k => k !== 'default' && k.startsWith(val));
    if (match) input.value = match;
  }
});

// Click anywhere → focus input
term.addEventListener('click', () => { if (!booting) input.focus(); });

// ── Start ─────────────────────────────────────────────────────────────
boot();
</script>
